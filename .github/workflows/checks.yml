name: checks

on:
  push:
  pull_request:

jobs:
  data:
    name: Committed data matches the extractors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the version the committed JSON was built with, so the
      # byte-for-byte rebuild compares like with like.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl==3.1.5
      - run: python3 -m unittest discover tests -v

  smoke:
    name: Explorer loads in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/smoke.js
